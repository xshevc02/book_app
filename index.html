<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="A cozy book tracker for shelves, reading progress, and a bookish social feed." />
    <meta name="mobile-web-app-capable" content="no" />
    <meta name="apple-mobile-web-app-capable" content="no" />
    <title>Pockland</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      (() => {
        const purgeKey = "pockland-pwa-purge-v3";
        const cacheNameLooksOurs = (key) =>
          /pockland|book[_-]?app|workbox|precache|vite/i.test(key);

        if ("caches" in window) {
          caches.keys()
            .then((keys) => Promise.all(keys.filter(cacheNameLooksOurs).map((key) => caches.delete(key))))
            .catch(() => {});
        }

        if (!("serviceWorker" in navigator)) return;

        navigator.serviceWorker.getRegistrations()
          .then((registrations) => Promise.all(registrations
            .filter((registration) => registration.scope.includes("/book_app/") || registration.scope === `${window.location.origin}/`)
            .map((registration) => registration.unregister())))
          .then(() => {
            if (navigator.serviceWorker.controller && !sessionStorage.getItem(purgeKey)) {
              sessionStorage.setItem(purgeKey, "1");
              window.location.reload();
            }
          })
          .catch(() => {});
      })();
    </script>
    <script type="module" src="/src/main.js?v=148"></script>
  </body>
</html>
